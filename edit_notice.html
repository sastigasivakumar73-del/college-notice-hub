{% extends "base.html" %}
{% block title %}Edit Notice - College Notice Hub{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <h2 class="section-title mb-4">Edit Notice</h2>

      <form method="post" action="{{ url_for('edit_notice', notice_id=notice['id']) }}" enctype="multipart/form-data" class="form-card p-4 p-md-5">
        <div class="mb-3">
          <label class="form-label">Notice Title</label>
          <input type="text" name="title" class="form-control" value="{{ notice['title'] }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea name="description" rows="4" class="form-control" required>{{ notice['description'] }}</textarea>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select" required>
              {% for cat in categories %}
              <option value="{{ cat }}" {% if notice['category'] == cat %}selected{% endif %}>{{ cat }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Published Date</label>
            <input type="date" name="published_date" class="form-control" value="{{ notice['published_date'] }}" required>
          </div>
        </div>

        {% if notice['filename'] %}
        <div class="mb-3">
          <label class="form-label">Current File</label>
          <div>
            <a href="{{ url_for('uploaded_file', filename=notice['filename']) }}" target="_blank">
              <i class="fa-solid fa-paperclip"></i> {{ notice['filename'] }}
            </a>
          </div>
        </div>
        {% endif %}

        <div class="mb-4">
          <label class="form-label">Replace File (optional)</label>
          <input type="file" name="notice_file" class="form-control" accept=".pdf,.jpg,.jpeg,.png">
          <div class="form-text">Leave empty to keep the current file. Maximum size: 5 MB</div>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          <i class="fa-solid fa-floppy-disk"></i> Update Notice
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
