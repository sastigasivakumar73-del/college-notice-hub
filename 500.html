{% extends "base.html" %}
{% block title %}Server Error - College Notice Hub{% endblock %}

{% block content %}
<section class="container py-5 text-center error-page">
  <div class="error-code">500</div>
  <h2 class="fw-bold mb-3">Something Went Wrong</h2>
  <p class="text-muted mb-4">An unexpected server error occurred. Please try again later.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">
    <i class="fa-solid fa-house"></i> Go to Home
  </a>
</section>
{% endblock %}
